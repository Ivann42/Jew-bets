<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Royal Poker</title>
<style>

.bub.pop{animation:pp .35s}@keyframes pp{from{transform:translateX(-50%) scale(.4);opacity:0}}
.bub.bf{--bc:#b3202f;color:#fff}.bub.bc{--bc:#e8e8e8;color:#111}.bub.br{--bc:#f5c542;color:#111}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:4px 0}.row input{flex:1;min-width:120px;accent-color:var(--gd)}

.x{position:absolute;top:8px;right:8px;padding:2px 8px}.bigp{font:700 54px Georgia,serif;color:var(--gd)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.g div{background:#0d1117;border-radius:8px;padding:8px;font-size:11px;color:var(--mu)}.g b{display:block;font-size:20px;color:var(--tx)}
@media(max-width:900px){main{grid-template-columns:1fr}aside{max-height:240px}.seat{width:100px}.card.big{width:38px;height:54px}.pl b{font-size:11px}.av{font-size:20px}}
</style></head><body>
<header><h1>♠ Royal Poker <span style="color:var(--rd)">♥</span></h1><span id="hd"></span><div><button onclick="stats()">📊 Perfil</button> <button class="gd" onclick="menu()">♠ Nueva partida</button></div></header>

<div class="row" id="rs"><input type="range" id="sl"><input type="number" id="amt" inputmode="numeric" aria-label="Cantidad exacta"><button data-q="0">Mín</button><button data-q=".5">½ bote</button><button data-q="1">Bote</button><button data-q="-1">All-in</button></div></div></section>
<aside><h3>📜 Registro de jugadas</h3><div id="lg"></div><details id="lgd" open></details></aside></main><div id="md" hidden></div>
<script>

const pot=()=>P.reduce((s,p)=>s+p.inv,0),live=()=>P.filter(p=>!p.fold&&!p.out),canAct=p=>!p.fold&&!p.out&&!p.allin;
const nm=p=>`<b style="color:${COL[p.i]}">${p.n}</b>`,cs=c=>`<span class="${[1,2].includes(c/13|0)?'rd':''}">${RK(c%13+2)}${SU[c/13|0]}</span>`;
const cardHTML=(c,k='',d=0)=>{const a=d?` style="animation-delay:${d}ms"`:'';return c==null?`<div class="card back ${k}"${a}></div>`:`<div class="card ${k} ${[1,2].includes(c/13|0)?'red':''}"${a}><b>${RK(c%13+2)}</b><i>${SU[c/13|0]}</i></div>`};
function L(h,c=''){const d=document.createElement('div');d.className=c;d.innerHTML=h;g('lg').append(d);g('lg').scrollTop=1e9}
function modal(h){const m=g('md');m.hidden=false;m.innerHTML=`<div class="box">${h}<button class="x" onclick="P.length?g('md').hidden=true:menu()">✕</button></div>`}

g('md').innerHTML=`<div class="lobby"><div class="fan">${[12,25,38,51].map((c,k)=>`<span style="transform:rotate(${(k-1.5)*16}deg)">${cardHTML(c,'big')}</span>`).join('')}</div><div class="neon">ROYAL CASINO</div><div class="suits">♠ <i>♥</i> ♣ <i>♦</i></div><p class="sub">SALA VIP DE PÓKER · MESA DE 6 JUGADORES</p>
<div class="panel"><label>Tu nombre<input id="mn" maxlength="12" value="${ST.name||''}" placeholder="Jugador"></label>
<label>Modalidad<select id="mv">${o('hold','Texas Hold’em')}${o('omaha','Omaha (4 cartas)')}${o('bigo','Omaha 5 cartas (Big O)')}${o('court','Courchevel')}${o('short','Short Deck (6+)')}${o('draw','Five Card Draw')}</select></label>

<label>Modo<select id="mt">${o(0,'Partida libre (1000€)')}${o(1,'Torneo (1500€, ciegas crecientes)')}</select></label>

function stats(){const t=ST.w+ST.l;modal(`<h2>🧑 ${ST.name||'Tu perfil'}</h2><div class="bigp">${t?Math.round(ST.w/t*100):0}%</div><p>Win rate (manos)</p><div class="g"><div><b>${ST.h}</b>Manos</div><div><b>${ST.w}</b>Ganadas</div><div><b>${ST.l}</b>Perdidas</div><div><b>${ST.tp}</b>Torneos</div><div><b>${ST.tw}</b>Torneos ganados</div></div><button onclick="ST={h:0,w:0,l:0,tp:0,tw:0,name:ST.name};save();stats()">Reiniciar</button>`)}
function ev5(c){const r=c.map(x=>x%13+2).sort((a,b)=>b-a),f=c.every(x=>(x/13|0)==(c[0]/13|0)),n={};r.forEach(x=>n[x]=(n[x]||0)+1);
const q=Object.keys(n).map(Number).sort((a,b)=>n[b]-n[a]||b-a);let s=0,k=q.slice();
if(q.length==5){if(r[0]-r[4]==4){s=1;k=[r[0]]}else if(r[0]==14&&r[1]==(MO.sd?9:5)){s=1;k=[MO.sd?9:5]}}
const m=n[q[0]],m2=n[q[1]],cat=s&&f?8:m==4?7:m==3&&m2==2?6:f?5:s?4:m==3?3:m==2&&m2==2?2:m==2?1:0;
return (MO.sd?[0,1,2,4,3,6,5,7,8][cat]:cat)*759375+k.reduce((a,x)=>a*15+x,0)}
function cmb(a,k){if(!k)return[[]];if(a.length<k)return[];const[h,...t]=a;return[...cmb(t,k-1).map(x=>[h,...x]),...cmb(t,k)]}
function best(h,b,om){let s=0;const C=om?cmb(h,2).flatMap(x=>cmb(b,3).map(y=>x.concat(y))):cmb(h.concat(b),5);for(const c of C)s=Math.max(s,ev5(c));return s}
function pre(h){const r=h.map(x=>x%13+2).sort((a,b)=>b-a),su=h.map(x=>x/13|0);let s=r.reduce((a,x)=>a+x,0)/r.length/14*.55;
for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++){if(r[i]==r[j])s+=r[i]/14*.2/(r.length/2);if(su[i]==su[j])s+=.03;if(Math.abs(r[i]-r[j])<3)s+=.015}return Math.min(s,.95)}
function lim(p){const mx=p.bet+p.chips,tc=cur-p.bet;let lo=cur+minR,hi=mx;if(STR=='pl')hi=cur+pot()+tc;if(STR=='fl')lo=hi=cur+(street<2?bb:2*bb);lo=Math.min(lo,mx);hi=Math.min(Math.max(hi,lo),mx);return[lo,hi]}
function aiAct(p){const tc=cur-p.bet,po=pot(),pr=p.ai,[lo,hi]=lim(p),can=p.bet+p.chips>cur;

function humanAct(p){return new Promise(res=>{const tc=Math.min(cur-p.bet,p.chips),[lo,hi]=lim(p),mx=p.bet+p.chips,can=mx>cur,sl=g('sl');
g('act').hidden=false;g('bF').style.display=tc?'':'none';g('bC').textContent=tc?`Voy con ${tc}€`:'Mesa';g('bR').style.display=can?'':'none';g('rs').style.display=can?'flex':'none';
const am=g('amt'),cl=v=>Math.max(lo,Math.min(hi,Math.round(+v)||lo));

const done=a=>{g('act').hidden=true;res(a)};g('bF').onclick=()=>done({t:'fold'});g('bC').onclick=()=>done({t:'call'});g('bR').onclick=()=>done({t:'raise',to:cl(am.value)})})}
const put=(p,a)=>{p.chips-=a;p.bet+=a;p.inv+=a;if(!p.chips)p.allin=1};
async function turn(p){turnI=p.i;render();let a;
if(p.i==0)a=await humanAct(p);else{p.bub='💭 …';p.bt='';p.pop=1;render();await S(700+Math.random()*800);a=aiAct(p)}
turnI=-1;p.pop=1;const tc=Math.min(cur-p.bet,p.chips);let r=0;
if(a.t=='fold'){p.fold=1;p.bub='Paso';p.bt='f';L(`${nm(p)} se retira`,'f')}
else if(a.t=='call'){put(p,tc);p.bt='c';p.bub=!tc?'Mesa':`${p.allin?'¡All-in! ':''}Voy con ${tc}€`;L(`${nm(p)} ${tc?(p.allin?'va all-in con '+tc+'€':'iguala '+tc+'€'):'hace mesa'}`,'c')}
else{const to=Math.min(a.to,p.bet+p.chips),o=cur;put(p,to-p.bet);minR=Math.max(minR,to-cur);cur=Math.max(cur,to);r=1;p.bt='r';p.bub=`${p.allin?'¡All-in! ':''}Voy con ${to}€ ⬆`;L(`${nm(p)} ${o?'sube a':'apuesta'} ${to}€${p.allin?' (all-in)':''}`,'r')}
render();return r}
async function round(f){let pend=P.filter(canAct).map(p=>p.i),i=f;
while(live().length>1&&pend.length){if(pend.length==1&&P[pend[0]].bet>=cur&&P.filter(canAct).length<2)break;
if(!pend.includes(i)){i=(i+1)%6;continue}
const p=P[i];pend=pend.filter(x=>x!=i);if(await turn(p))pend=P.filter(q=>canAct(q)&&q.i!=i).map(q=>q.i);i=(i+1)%6}
P.forEach(p=>p.bet=0);cur=0}
function post(p,a,t){a=Math.min(a,p.chips);put(p,a);L(`${nm(p)} pone ${t} ${a}€`,'sys')}
async function playHand(){
hand++;if(TRN){const l=Math.min((hand-1)/5|0,7);if(l!=lvl){lvl=l;[sb,bb]=LV[l];if(l)L(`⬆ Suben las ciegas a ${sb}/${bb}`,'sys')}}else[sb,bb]=[10,20];
deck=[...Array(52).keys()].filter(c=>!MO.sd||c%13>3);for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
board=[];lastB=0;street=0;const st0={};
P.forEach(p=>{p.hole=[];p.bet=p.inv=0;p.fold=p.out;p.allin=0;p.bub='';p.show=0;p.win=0;st0[p.i]=p.chips});
const al=()=>P.filter(p=>!p.out),nx=i=>{do i=(i+1)%6;while(P[i].out);return i};
dealer=nx(dealer<0?5:dealer);const sbS=al().length==2?dealer:nx(dealer),bbS=nx(sbS);
for(let k=0;k<MO.h;k++)al().forEach(p=>p.hole.push(deck.pop()));if(MO.pf)board.push(deck.pop());
ANIM=1;L(`Mano #${hand} · ciegas ${sb}/${bb}€ · dealer ${P[dealer].n}`,'hd');
post(P[sbS],sb,'ciega pequeña');post(P[bbS],bb,'ciega grande');cur=bb;minR=bb;render();await S(MO.h>2?2000:1300);
await round(nx(bbS));
if(MO.dr)await drawFlow(nx);else for(street=1;street<4&&live().length>1;street++){
L(['','Flop','Turn','River'][street]+' · ronda de apuestas','hd');P.forEach(p=>{if(!p.fold)p.bub=''});cur=0;minR=bb;render();await S(700);
for(let j=0;j<(street==1?3-(MO.pf||0):1);j++){board.push(deck.pop());render();await S(450)}
L('Mesa: '+board.map(cs).join(' '));await S(300);await round(nx(dealer))}
street=3;const lv=live(),sc={};
if(lv.length>1)lv.forEach(p=>{p.show=1;sc[p.i]=best(p.hole,board,OM);L(`${nm(p)} muestra ${hn(sc[p.i])}`)});
const lvls=[...new Set(P.map(p=>p.inv).filter(x=>x))].sort((a,b)=>a-b),gain={};let prev=0;
for(const V of lvls){const amt=P.reduce((s,p)=>s+Math.max(0,Math.min(p.inv,V)-prev),0);prev=V;let el=lv.filter(p=>p.inv>=V);if(!el.length)el=[lv.reduce((a,b)=>b.inv>a.inv?b:a)];
const m=Math.max(...el.map(p=>sc[p.i]||0)),w=el.filter(p=>(sc[p.i]||0)==m),sh=amt/w.length|0;w.forEach((p,k)=>gain[p.i]=(gain[p.i]||0)+sh+(k?0:amt-sh*w.length))}
for(const i in gain){const p=P[i];p.chips+=gain[i];p.win=1;p.bub=`🏆 +${gain[i]}€`;p.bt='r';p.pop=1;L(`${nm(p)} gana ${gain[i]}€`+(lv.length>1?` con ${hn(sc[p.i])}`:' (todos se retiran)'),'win')}
P.forEach(p=>{if(p.inv&&!gain[p.i]){p.bub=`−${p.inv}€`;p.bt='f';p.pop=1;L(`${nm(p)} pierde ${p.inv}€`,'f')}});P.forEach(p=>p.inv=0);
if(!P[0].out&&st0[0]!=null&&(st0[0]>0)){const n=P[0].chips-st0[0];ST.h++;if(n>0)ST.w++;else if(n<0)ST.l++}
render();await S(3200);
P.forEach(p=>{if(!p.out&&!p.chips){if(TRN||p.i==0){p.out=1;L(`💀 ${p.n} eliminado`,'sys')}else{p.chips=1000;L(`${p.n} recompra 1000€`,'sys')}}});
if(P[0].out){if(TRN)ST.tp++;save();gameOver();return false}
if(al().length==1){ST.tp++;ST.tw++;save();modal('<h2>🏆 ¡Campeón!</h2><p>Has ganado el torneo.</p><button class="gd" onclick="menu()">Nueva partida</button>');return false}
save();return true}
async function loop(){const id=GID;try{while(id==GID&&await playHand());}catch(e){if(e)console.error(e)}}
function newGame(o){GID++;LAST=o;ST.name=(o.name||'').replace(/[<>&"']/g,'').trim().slice(0,12);save();MO=MD[o.mode];OM=MO.o;D=DFC[o.df];DFN=o.df;DRW=0;g('dr').hidden=true;STR=o.str;TRN=o.trn;hand=0;dealer=-1;lvl=-1;turnI=-1;g('act').hidden=true;g('md').hidden=true;g('lg').innerHTML='';
P=NAMES.map((n,i)=>({i,n:i?n[0]:(ST.name||'Tú'),e:n[1],chips:TRN?1500:1000,hole:[],bet:0,inv:0,fold:0,out:0,allin:0,bub:'',ai:PR[i]}));board=[];
L(`🎲 ${MO.n} · ${{nl:'No Limit',pl:'Pot Limit',fl:'Límite fijo'}[STR]} · ${TRN?'Torneo':'Partida libre'}`,'hd');legend();loop()}
const hn=v=>(MO.sd?HS:HN)[v/759375|0];
function legend(){const H=MO.sd?HS:HN,d=g('lgd');d.innerHTML=`<summary>ℹ Fichas y manos</summary><div class="lgb"><div>${[...DN].reverse().map(([v,c])=>`<span class="cd"><b style="background:${c}"></b>${v}€</span>`).join('')}</div><ol>${[...H].reverse().map(x=>`<li>${x}</li>`).join('')}</ol></div>`;d.open=innerWidth>=900}
function aiDiscard(p){const h=p.hole,n={},u={};h.forEach(c=>{n[c%13]=(n[c%13]||0)+1;u[c/13|0]=(u[c/13|0]||0)+1});if(best(h,[],0)/759375>=4)return[];
const fs=Object.keys(u).find(k=>u[k]==4);let d=h.map((c,j)=>j).filter(j=>fs!=null?(h[j]/13|0)!=fs:n[h[j]%13]==1);
if(fs==null&&d.length==5)d=d.sort((a,b)=>h[a]%13-h[b]%13).slice(0,3);return d}
function humanDraw(p){return new Promise(res=>{DRW=1;SEL=new Set;const b=g('bD'),u=()=>b.textContent=SEL.size?`Cambiar ${SEL.size}`:'Quedarme';g('dr').hidden=false;u();
window.togg=j=>{SEL.has(j)?SEL.delete(j):SEL.add(j);u();render()};b.onclick=()=>{g('dr').hidden=true;DRW=0;const d=[...SEL];SEL=new Set;render();res(d)};render()})}
async function drawFlow(nx){if(live().length<2)return;L('Fase de descarte','hd');
for(const p of live()){let d;if(p.i==0)d=await humanDraw(p);else{await S(600);d=aiDiscard(p)}
d.forEach(j=>p.hole[j]=deck.pop());p.bub=d.length?`Cambio ${d.length}`:'Me quedo';p.bt='c';p.pop=1;L(`${nm(p)} ${d.length?'cambia '+d.length+' cartas':'se queda'}`,'c');render();await S(350)}
street=1;P.forEach(p=>{if(!p.fold)p.bub=''});cur=0;minR=bb;L('Ronda de apuestas final','hd');render();await S(600);await round(nx(dealer))}
const DN=[[1000,'#e0b020'],[500,'#7b3fa0'],[100,'#1a1a1a'],[25,'#1e8a4c'],[5,'#c0262d'],[1,'#e6e6e6']];
function chips(a,m=5){let h='',n=0;for(const[d,c]of DN){const k=a/d|0;a-=k*d;if(k&&n<m){n++;h+=`<span class="stk" style="--c:${c}">${'<i></i>'.repeat(Math.min(k,6))}</span>`}}return h}
function render(){g('pt').innerHTML=`<span style="display:inline-flex;align-items:flex-end">${chips(pot(),5)}</span><span>Bote: ${pot()}€</span>`;
g('bdr').innerHTML=MO.dr?'':[0,1,2,3,4].map(i=>board[i]!=null?cardHTML(board[i],'big'+(i>=lastB?' deal':'')):'<div class="card big empty"></div>').join('');lastB=board.length;
g('seats').innerHTML=P.map((p,i)=>{const d=ANIM?' deal':'';
const cc=(c,j,sh)=>sh?cardHTML(c,(p.i?'sm':'big')+d,ANIM?(j*6+i)*80:0):cardHTML(null,'sm'+d,ANIM?(j*6+i)*80:0),hc=p.out?'':p.hole.map((c,j)=>{const x=cc(c,j,p.i==0||p.show);return DRW&&p.i==0?`<span class="pk ${SEL.has(j)?'on':''}" onclick="togg(${j})">${x}</span>`:x}).join('');
return `<div class="seat ${p.fold?'fold':''} ${turnI==i?'turn':''} ${p.win?'win':''}" style="left:${POS[i][0]}%;top:${POS[i][1]}%">${p.bub&&!p.out?`<div class="bub b${p.bt||''} ${p.pop?'pop':''}">${p.bub}</div>`:''}<div>${hc}</div>
<div class="pl"><span class="av">${p.out?'💀':p.e}</span><div><b style="color:${COL[i]}">${p.n}</b><small>${p.out?'Eliminado':p.chips+'€'}</small></div><span class="ms">${p.out?'':chips(p.chips,3)}</span>${dealer==i&&!p.out?'<em class="dl">D</em>':''}</div>${p.bet?`<div class="bt">${chips(p.bet,3)}<span>${p.bet}€</span></div>`:''}</div>`}).join('');
g('hd').textContent=`${MO.n} · ${{nl:'No Limit',pl:'Pot Limit',fl:'Límite fijo'}[STR]} · ${TRN?'Torneo':'Libre'} · Ciegas ${sb}/${bb}€ · IA ${['Fácil','Normal','Difícil'][DFN]} · Mano ${hand}`;
g('stt').textContent=['Pre-flop','Flop','Turn','River'][street]+' · '+(turnI>0?'Turno de '+P[turnI].n:turnI==0?'¡Tu turno!':'Repartiendo / recuento');
ANIM=0;P.forEach(p=>p.pop=0)}
legend();menu();
</script></body></html>
